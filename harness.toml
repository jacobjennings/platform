main_branch = "jj/activity-feed"
setup = ["node common/scripts/install-run-rush.js install"]
full_suite = "node common/scripts/install-run-rush.js test"
typecheck = "node common/scripts/install-run-rush.js validate"
# Empty on purpose. A merge never deploys. A deploy to huly.lan is an owner step.
deploy_command = ""

[search]
repository_root = "."
roots = ["docs"]
task_url = "http://huly.lan/workbench/hulyaccessevaluation/tracker/{id}"
board_root_project = "huly-platform"

[worker_secrets]
account_key = "~/.ssh/lab-workers-github"
account_user = "jacobjennings"
known_hosts = "~/.ssh/known_hosts"
# Workers never get the repo-root .env (it is gitignored, so never in a worktree)
# or any production credential.
masked_paths = ["~/.aws", "~/.azure", "~/.kube", "~/.docker", "~/.netrc", "~/.git-credentials"]

[orchestrator]
routes_hard = ["spark/qwen3.8-flash-next"]
small_only_hosts = ["bb"]
launcher_limit_hosts = ["spark"]
default_preset = "jjpc/qwen3.8-27b"
merge_preset = "none"
laya_url = "http://laya.lan:8080"
publish_script = "~/gh/jake-homelab/scripts/publish-report.sh"
review_model = "gpt-6.1-sol"
merge_train_model = "gpt-6.1-sol"
overflow_effort_small = "low"
# Moderate implementation and fixes: jjpc first, then Spark, before any Sol overflow. bb stays
# for filler and small work (mklocal drops it for other cards). Jake, 2026-10-07: "Spark was
# always the priority over sol."
routes_moderate = ["jjpc/qwen3.8-27b", "spark/qwen3.8-flash-next", "bb/qwen3.8-27b-awq"]
docs_checkout = "~/gh/huly-platform"
state_dir = "~/.cache/huly-platform/orchestrator"
role_index = "~/.cache/huly-platform/launcher/role-index.jsonl"
tmux_session = "huly-platform"
env_prefix = "HP"
opencode_launcher = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/launch/run-opencode-worker.sh"
native_launcher = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/launch/run-native-worker.sh"
brief_checker = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/briefs/check-brief.py"
opencode_policy_checker = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/policy/check-opencode-launch-policy.py"
policy_file = "docs/harness/worker-model-policy.md"
board_cli = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/board/huly-board-cli.cjs"
board_scripts = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/supervision"
owner_git_name = "Jacob Jennings"
owner_git_email = "jacob.r.jennings@gmail.com"
worker_guide = "docs/harness/worker-guide.md"
report_root = "docs/harness/reports"
worker_tmpdir = "/tmp/huly-platform-workers"
worker_setup = ["node common/scripts/install-run-rush.js install"]
full_suite = "node common/scripts/install-run-rush.js test"
typecheck = "node common/scripts/install-run-rush.js validate"
deps_check = "test -d common/temp/node_modules && echo DEPS_READY"
card_link_base = "http://huly.lan/workbench/hulyaccessevaluation/tracker/"
board_project_prefix = "HP"
board_project_id = "dddfbaff-e1ae-9aca-f80f-b900943833cd"
harness_checkout = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05"
harness_repository = "git@github.com:jacobjennings/jake-harness.git"
harness_review_model = "gpt-6.1-sol"
# Branch reviews of this project (make-branch-review). Jake, 2026-10-09: "Let's run Haiku via opencode and API
# key for workers for a while, with Sol Low reviewers." Asked which reviews: "All reviews".
review_effort = "low"
harness_review_effort = "low"
# Merges, branch and merge-train. Jake, 2026-10-05: "Merges can go to Sol Low."
harness_merge_effort = "low"
merge_train_effort = "low"

[fleet]
tiers = { hard = ["spark/qwen3.8-flash-next"], moderate = ["jjpc/qwen3.8-27b", "spark/qwen3.8-flash-next"], small = ["bb/qwen3.8-27b-awq", "jjpc/qwen3.8-27b", "spark/qwen3.8-flash-next"] }
default_tier = "moderate"
effort = "default"
filler_routes = ["spark/qwen3.8-flash-next", "jjpc/qwen3.8-27b", "bb/qwen3.8-27b-awq"]
filler_time_limits = { default = "20m", "spark/" = "40m" }
reservation_grace_seconds = 900
launch_wait_seconds = 60
lock_wait_seconds = 60
timer_minutes = 5
timezone = "America/Chicago"
decision_label = "owner-decision"
urgent_label = "director-approved"
queued_label = "stage:queued"
blocking_labels = ["owner-decision", "epic", "blocked", "paused"]
follow_on_labels = ["stage:review", "stage:merge", "kind:review", "kind:merge"]
follow_on_title_pattern = '^\s*(?:merge|review)\b'
branch_prefix = "codex/"

[fleet.card_preparation]
enabled = false

# Sol overflow (Jake, 2026-10-04): when every local route below is healthy and full,
# implementation work runs on Codex gpt-6.1-sol instead of waiting. A free local slot
# still comes first. See docs/harness/worker-model-policy.md.
[overflow]
enabled = true
provider = "openai"
model = "gpt-6.1-sol"
effort = "medium"
roles = ["implementation"]
local_routes = ["spark/qwen3.8-flash-next", "jjpc/qwen3.8-27b"]

# Launch policy: the one place routing lives (owner ruling of 11
# October 2026: "yes to toml"). The launch gates in policy/ and the route
# resolver in supervision/worker_routes.py read these tables. A routing change
# is a one-line edit here, not a card. Each value keeps the owner ruling it
# came from, as a comment beside it.
[launch_policy.claude]
# Owner, 10 October 2026: "Haiku through the harness's Claude CLI launcher approved".
# The gate refuses a Claude launch for any role or model not listed here.
claude_new_launch_not_before_utc = "2020-01-01T00:00:00Z"
claude_allowance_status = "available"
claude_permitted_roles = "implementation"
claude_permitted_models = "claude-haiku-5-5"

[launch_policy.opencode]
# Local cluster routes and roles, docs/local-cluster.md.
opencode_worker_default_preset = "jjpc/qwen3.8-27b"
# Owner, 29 September 2026: "Old hosted routes: retire, but keep the info on how
# to use them in case I change things later." So no reviewer fallback route: the
# dispatcher reads none as no fallback, and a review waits when the Claude review
# route is down. A local route is refused for review by the role rule below.
# The retired glm route stays in openrouter_models, [launch_policy.opencode_presets].
opencode_reviewer_fallback_preset = "none"
opencode_glm_prohibited_roles = "implementation,analysis"
opencode_qwen_model = "openrouter/qwen/qwen3.7-flash"
opencode_qwen_permitted_purpose = "image-understanding"
opencode_qwen_prohibited_roles = "implementation,analysis,review,merge,reviewmerge"
opencode_local_routes = "jjpc/qwen3.8-27b,spark/qwen3.8-flash-next,bb/qwen3.8-27b-awq"
opencode_local_permitted_roles = "implementation,analysis"

[launch_policy.anthropic]
# Owner, 9 October 2026: "Let's run Haiku via opencode and API key for workers
# for a while, with Sol Low reviewers." Implementation only. Credit exhaustion
# persists until a Director removes the unhealthy marker under the user
# jake-harness config directory; provider work then uses the Claude CLI with Haiku.
anthropic_model = "anthropic/claude-haiku-5-5"
anthropic_permitted_roles = "implementation"
# The opencode launcher refuses an Anthropic route at any other effort.
anthropic_required_effort = "xhigh"

[launch_policy.automatic_routes]
# The dispatcher's automatic role routes. The review route names the policy
# review model above, under the opus launcher, because that is the launcher the
# dispatcher allows for review. jake-harness lanes launch their own reviews by
# hand through the orchestrator, on the owner's Codex account.
analysis = { launcher = "opencode", model = "jjpc/qwen3.8-27b", effort = "default" }
review = { launcher = "opus", model = "gpt-6.1-sol", effort = "low", reason = "owner ruling of 9 October 2026: reviews use Sol low" }
merge = { launcher = "native", model = "gpt-6.1-sol", effort = "low", reason = "owner ruling of 5 October 2026: Merges can go to Sol Low." }

# Native (Codex) worker models. run-native-worker.sh refuses any other model,
# and the refusal names this key.
[launch_policy.native]
native_models = "gpt-6-sol,gpt-6-luna,gpt-6-astra,gpt-6.1-sol"

# Hosted OpenRouter presets that run-opencode-worker.sh routes through OpenRouter.
# Local routes come from opencode_local_routes above and harness.toml [local_cluster].
[launch_policy.opencode_presets]
openrouter_models = "openrouter/@preset/deepseek-flash,openrouter/@preset/deepseek-pro,openrouter/@preset/glm-5-3-flash-fast,openrouter/stealth/ox-alpha,openrouter/qwen/qwen3.7-flash"
# The effort word that means the server's own setting. The launcher passes no --variant for it.
server_default_effort = "default"
# The time limit for a hosted worker with no OPENCODE_WORKER_TIME_LIMIT. A local route uses its own limit in harness.toml [local_cluster].
hosted_time_limit = "30m"

# Haiku limits written into the opencode run config, in tokens (run-opencode-worker.sh).
[launch_policy.anthropic_limits]
context_limit = 1000000
input_limit = 180000
output_limit = 64000
compaction_reserved = 20000
# Claude CLI workers (run-opus-worker.sh) compact at this many tokens, passed as --autocompact.
# Owner ruling of 12 October 2026: "the costs are so low with haiku I think we can afford a higher limit. Let's try 500k."
# The CLI takes 100000 to 1000000 tokens. The launcher refuses any other value.
claude_autocompact_tokens = 500000
