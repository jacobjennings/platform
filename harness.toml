process_markers = ["hp-fleet-block-start", "hp-fleet-block-end"]

[launch]
board = "huly"
waves_root = "~/.cache/huly-platform/waves"
role_index = "~/.cache/huly-platform/launcher/role-index.jsonl"
report_paths_index = "~/.cache/huly-platform/launcher/report-paths.jsonl"
