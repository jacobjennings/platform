# Harness pin: /home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05 (d765b05b0e)
# huly-platform (Huly fork, branch jj/activity-feed) settings for jake-harness. Read by every harness
# script through HARNESS_CONFIG, or from harness.toml in the working directory
# when unset. Deploys to huly.lan never run from the harness: they are an
# owner step after merge, so every deploy command here is empty.

[project]
work_authorized = true
name = "huly-platform"
repository = "git@github.com:jacobjennings/platform.git"
main_branch = "jj/activity-feed"
checkout = "~/gh/huly-platform"
waves_root = "~/.cache/huly-platform/waves"
worktree_root = "~/gh/huly-platform-worktrees"

[board]
offline = false
kind = "huly"
url = "http://huly.lan"
host = "root@huly.lan"
key = "~/.ssh/id_ed25519"
knownHosts = "/home/jakej/.config/chunkatlas/huly-known-hosts"
root = "/opt/huly/platform"
accounts = "/etc/huly/agent-account.json"
pageSize = 50
timeout = 600000
number_floor = 1
workspace = "hulyaccessevaluation"
project_identifier = "HP"
stage_status_projects = ["HP"]
project_template_identifier = "JH"

[policy]
review_model = "gpt-6.1-sol"
file = "harness.toml"
quota_cache = "~/.cache/huly-platform/provider-quota.json"
analytics_path = "/codex/cloud/settings/analytics"

[tests]
node = "/home/jakej/.local/opt/node-22/bin/node"
full_suite = "node common/scripts/install-run-rush.js test"
typecheck = "node common/scripts/install-run-rush.js validate"
setup = ["node common/scripts/install-run-rush.js install"]

[deploy]
command = ""

[hosts]
local_git_origins = []
analytics = "chatgpt.com"

[briefs]
template = "docs/harness/brief-template.md"
directory = "docs/harness/briefs/"
setup_commands = ["node common/scripts/install-run-rush.js install"]
gate_commands = ["node common/scripts/install-run-rush.js test"]
suite_runners = []

[checks]
repository_root = "."
base = "origin/jj/activity-feed"
file_limit = 10000000
total_limit = 50000000
size_exceptions = "repository-size-exceptions.json"

[ops]
