sparse_pattern = "worker-sparse-checkout.pattern"
main_branch = "jj/activity-feed"
report_directory = "docs/harness/reports"
pre_declaration_waves = []
worker_guide = "docs/harness/worker-guide.md"
review_guide = "docs/harness/review-guide.md"
merge_guide = "docs/harness/merge-guide.md"

[supervision]
launcher_dir = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/launch"
role_index = "~/.cache/huly-platform/launcher/role-index.jsonl"
waves_root = "~/.cache/huly-platform/waves"
worktrees_root = "~/gh/huly-platform-worktrees"
checkout = "~/gh/huly-platform"
policy_file = "docs/harness/worker-model-policy.md"
