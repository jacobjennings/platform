# Harness pin: /home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05 (d765b05b0e)
# huly-platform (Huly fork, branch jj/activity-feed) settings for jake-harness. Read by every harness
# script through HARNESS_CONFIG, or from harness.toml in the working directory
# when unset. Deploys to huly.lan never run from the harness: they are an
# owner step after merge, so every deploy command here is empty.

[project]
work_authorized = true
name = "huly-platform"
repository = "git@github.com:jacobjennings/platform.git"
main_branch = "main"
checkout = "~/gh/huly-platform"
waves_root = "~/.cache/huly-platform/waves"
worktree_root = "~/gh/huly-platform-worktrees"

[board]
offline = false
kind = "huly"
url = "http://huly.lan"
host = "root@huly.lan"
key = "~/.ssh/id_ed25519"
knownHosts = "/home/jakej/.config/chunkatlas/huly-known-hosts"
root = "/opt/huly/platform"
accounts = "/etc/huly/agent-account.json"
pageSize = 50
timeout = 600000
number_floor = 1
workspace = "hulyaccessevaluation"
project_identifier = "HP"
stage_status_projects = ["HP"]
project_template_identifier = "JH"

[policy]
review_model = "gpt-6.1-sol"
file = "docs/harness/worker-model-policy.md"
quota_cache = "~/.cache/huly-platform/provider-quota.json"
analytics_path = "/codex/cloud/settings/analytics"

[tests]
full_suite = "node common/scripts/install-run-rush.js test"
typecheck = "node common/scripts/install-run-rush.js validate"
setup = ["node common/scripts/install-run-rush.js install"]

[deploy]
command = ""

[hosts]
local_git_origins = []
analytics = "chatgpt.com"

[briefs]
template = "docs/harness/brief-template.md"
directory = "docs/harness/briefs/"
setup_commands = ["node common/scripts/install-run-rush.js install"]
gate_commands = ["node common/scripts/install-run-rush.js test"]
suite_runners = []

[checks]
repository_root = "."
base = "origin/main"
file_limit = 10000000
total_limit = 50000000
size_exceptions = "repository-size-exceptions.json"

[ops]
beat_file = "~/.cache/huly-platform/orchestrator/last-beat.json"
state_dir = "~/.local/state/huly-platform/beat-dead-man-switch"
alertmanager_url = "http://alertmanager.lan/api/v2/alerts"
alert_name = "OrchestratorBeatStale"
alert_severity = "page"
alert_instance = "jjpc"
stale_seconds = 1800
tick_seconds = 600
ledger_path = "docs/harness/task-status.md"
excluded_worktrees = []
excluded_name_fragments = ["director", "swapover"]
archive_repository = "~/archives/huly-platform-archive.git"

[writing]
known_names = ["Huly", "Rush", "Svelte", "MongoDB", "Elasticsearch", "MinIO", "GitHub", "Activity"]
process_markers = ["hp-fleet-block-start", "hp-fleet-block-end"]

[launch]
board = "huly"
waves_root = "~/.cache/huly-platform/waves"
role_index = "~/.cache/huly-platform/launcher/role-index.jsonl"
report_paths_index = "~/.cache/huly-platform/launcher/report-paths.jsonl"
brief_tmpdir = "/tmp/huly-platform-workers"
sparse_pattern = "worker-sparse-checkout.pattern"
main_branch = "main"
report_directory = "docs/harness/reports"
pre_declaration_waves = []
worker_guide = "docs/harness/worker-guide.md"
review_guide = "docs/harness/review-guide.md"
merge_guide = "docs/harness/merge-guide.md"

[supervision]
launcher_dir = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/launch"
role_index = "~/.cache/huly-platform/launcher/role-index.jsonl"
waves_root = "~/.cache/huly-platform/waves"
worktrees_root = "~/gh/huly-platform-worktrees"
checkout = "~/gh/huly-platform"
policy_file = "docs/harness/worker-model-policy.md"
token_file = "~/.cache/huly-platform/board-token"
board_kind = "huly"
board_url = "http://huly.lan"
board_projects = ["HP"]
board_offline = false
queued_label = 6
review_queued_label = 9
merge_queued_label = 10
fallback_checker = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/policy/check-opencode-launch-policy.py"
floor_enabled = false
floor_command = []
ledger_file = "docs/harness/task-status.md"
snapshot_directory = "docs/harness/reports"
report_paths_index = "~/.cache/huly-platform/launcher/report-paths.jsonl"
report_directory = "docs/harness/reports"
native_number_floor = 1
board_root_project = "huly-platform"
task_url = "{board_url}/workbench/hulyaccessevaluation/tracker/{id}"
fleet_block_marker = "hp-fleet-block"
serving_url = ""
serving_module_path = ""
board_workspace = "hulyaccessevaluation"

[merge]
repository = "git@github.com:jacobjennings/platform.git"
main_branch = "main"
setup = ["node common/scripts/install-run-rush.js install"]
full_suite = "node common/scripts/install-run-rush.js test"
typecheck = "node common/scripts/install-run-rush.js validate"
# Empty on purpose. A merge never deploys. A deploy to huly.lan is an owner step.
deploy_command = ""

[search]
repository_root = "."
roots = ["docs"]
task_url = "http://huly.lan/workbench/hulyaccessevaluation/tracker/{id}"
board_root_project = "huly-platform"

[worker_secrets]
account_key = "~/.ssh/lab-workers-github"
account_user = "jacobjennings"
known_hosts = "~/.ssh/known_hosts"
# Workers never get the repo-root .env (it is gitignored, so never in a worktree)
# or any production credential.
masked_paths = ["~/.aws", "~/.azure", "~/.kube", "~/.docker", "~/.netrc", "~/.git-credentials"]

[orchestrator]
# Moderate implementation and fixes: jjpc first, then Spark, before any Sol overflow. bb stays
# for filler and small work (mklocal drops it for other cards). Jake, 2026-10-07: "Spark was
# always the priority over sol."
routes_moderate = ["jjpc/qwen3.8-27b", "spark/qwen3.8-flash-next", "bb/qwen3.8-27b-awq"]
docs_checkout = "~/gh/huly-platform"
state_dir = "~/.cache/huly-platform/orchestrator"
role_index = "~/.cache/huly-platform/launcher/role-index.jsonl"
tmux_session = "huly-platform"
env_prefix = "HP"
opencode_launcher = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/launch/run-opencode-worker.sh"
native_launcher = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/launch/run-native-worker.sh"
brief_checker = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/briefs/check-brief.py"
opencode_policy_checker = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/policy/check-opencode-launch-policy.py"
policy_file = "docs/harness/worker-model-policy.md"
board_cli = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/board/huly-board-cli.cjs"
board_scripts = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05/supervision"
owner_git_name = "Jacob Jennings"
owner_git_email = "jacob.r.jennings@gmail.com"
worker_guide = "docs/harness/worker-guide.md"
report_root = "docs/harness/reports"
worker_tmpdir = "/tmp/huly-platform-workers"
worker_setup = ["node common/scripts/install-run-rush.js install"]
full_suite = "node common/scripts/install-run-rush.js test"
typecheck = "node common/scripts/install-run-rush.js validate"
deps_check = "test -d common/temp/node_modules && echo DEPS_READY"
card_link_base = "http://huly.lan/workbench/hulyaccessevaluation/tracker/"
board_project_prefix = "HP"
board_project_id = "dddfbaff-e1ae-9aca-f80f-b900943833cd"
harness_checkout = "/home/jakej/gh/jake-harness-worktrees/huly-platform-pin-d765b05"
harness_repository = "git@github.com:jacobjennings/jake-harness.git"
harness_review_model = "gpt-6.1-sol"
# Branch reviews of this project (make-branch-review). Jake, 2026-10-09: "Let's run Haiku via opencode and API
# key for workers for a while, with Sol Low reviewers." Asked which reviews: "All reviews".
review_effort = "low"
harness_review_effort = "low"
# Merges, branch and merge-train. Jake, 2026-10-05: "Merges can go to Sol Low."
harness_merge_effort = "low"
merge_train_effort = "low"

[fleet]
tiers = { hard = ["spark/qwen3.8-flash-next"], moderate = ["jjpc/qwen3.8-27b", "spark/qwen3.8-flash-next"], small = ["bb/qwen3.8-27b-awq", "jjpc/qwen3.8-27b", "spark/qwen3.8-flash-next"] }
default_tier = "moderate"
effort = "default"
filler_routes = ["spark/qwen3.8-flash-next", "jjpc/qwen3.8-27b", "bb/qwen3.8-27b-awq"]
filler_time_limits = { default = "20m", "spark/" = "40m" }
reservation_grace_seconds = 900
launch_wait_seconds = 60
lock_wait_seconds = 60
timer_minutes = 5
timezone = "America/Chicago"
decision_label = "owner-decision"
urgent_label = "director-approved"
queued_label = "stage:queued"
blocking_labels = ["owner-decision", "epic", "blocked", "paused"]
follow_on_labels = ["stage:review", "stage:merge", "kind:review", "kind:merge"]
follow_on_title_pattern = '^\s*(?:merge|review)\b'
branch_prefix = "codex/"

[fleet.card_preparation]
enabled = false

# Sol overflow (Jake, 2026-10-04): when every local route below is healthy and full,
# implementation work runs on Codex gpt-6.1-sol instead of waiting. A free local slot
# still comes first. See docs/harness/worker-model-policy.md.
[overflow]
enabled = true
provider = "openai"
model = "gpt-6.1-sol"
effort = "medium"
roles = ["implementation"]
local_routes = ["spark/qwen3.8-flash-next", "jjpc/qwen3.8-27b"]
