interval_minutes = 40

# Routes copied verbatim from jake-harness main (owner, 19 Oct 2026: "The fork should match JH routes.").

# Launch allowance settings (owner ruling of 11
# October 2026: "yes to toml"). The launch gates in policy/ and the route
# resolver in supervision/worker_routes.py read these tables. A routing change
# is a one-line edit here, not a card. Each value keeps the owner ruling it
# came from, as a comment beside it.
[launch_policy.claude]
# Owner, 10 October 2026: "Haiku through the harness's Claude CLI launcher approved".
# The gate checks the role and model against the route table [routes."claude/<model>"],
# whose roles and model fields are the one source of that fact.
claude_new_launch_not_before_utc = "2020-01-01T00:00:00Z"
claude_allowance_status = "available"

[launch_policy.opencode]
# The checker and run-opencode-worker.sh now read each route's own [routes."NAME"] table:
# its provider, roles (or prohibited_roles), purpose and model. The only OpenCode routing
# facts that stay here are the reviewer fallback preset and the optional local route pair.
# Owner, 29 September 2026: "Old hosted routes: retire, but keep the info on how
# to use them in case I change things later." So no reviewer fallback route: the
# dispatcher reads none as no fallback, and a review waits when the Claude review
# route is down. A local route is refused for review by the role rule below.
opencode_reviewer_fallback_preset = "none"
# Owner ruling, 16 October 2026 about 7:11 pm CDT, given in chat and relayed to the JH Director:
# "jake-harness does not send tasks to the local GPUs on bb and spark. The code is there but it's
# not the current policy." The pair opencode_local_routes and opencode_local_permitted_roles is
# left out, so no OpenCode run can pick bb or spark. The policy checker reads a missing pair as no
# local route, and it refuses an empty list ("names no route"), which would refuse every OpenCode
# launch. The loader code stays. Name a route here again only on a new owner ruling.

# The hosted OpenRouter presets come from the [routes.*] tables with
# provider = "openrouter". The native Codex models come from the [routes.*]
# tables on the codex harness. One place, one fact.
[launch_policy.opencode_presets]
# The effort word that means the server's own setting. The launcher passes no --variant for it.
server_default_effort = "default"
# The time limit for a hosted worker with no OPENCODE_WORKER_TIME_LIMIT. A local route uses its own limit in harness.toml [local_cluster].
hosted_time_limit = "30m"

# Haiku limits written into the opencode run config, in tokens (run-opencode-worker.sh).
[launch_policy.anthropic_limits]
context_limit = 1000000
input_limit = 180000
output_limit = 64000
compaction_reserved = 20000
# Claude CLI workers (run-opus-worker.sh) compact at this many tokens, passed as --autocompact.
# Owner ruling of 12 October 2026: "the costs are so low with haiku I think we can afford a higher limit. Let's try 500k."
# The CLI takes 100000 to 1000000 tokens. The launcher refuses any other value.
claude_autocompact_tokens = 500000

# Optional [overflow] sends prepared implementation cards to the provider
# worker's primary selection only when every listed local route is healthy
# and full. Omit this table to use the default plan, whose provider, model and
# efforts are the overflow_* keys in [orchestrator] above. An explicit table keeps
# the destination shared with the provider worker policy, so a full local
# cluster never moves work to a model that policy did not choose. bb is never a
# trigger or an overflow destination.
[overflow]
roles = ["implementation"]
# Owner ruling of 16 October 2026: local trigger lists are retired.
# The retired spark route is documented in docs/local-cluster.md.
# max_lanes and quota_floor are unset. There is no overflow lane limit.
# Quota readings and quota_floor are information only.

# The provider worker routing policy, shared with the overflow destination.
# Owner, 9 October 2026: "Let's run Haiku via opencode and API key for workers
# for a while, with Sol Low reviewers." Every board priority runs on the
# primary selection. Owner ruling, 17 October 2026: "No fallback." Each role has
# exactly one route, and a route that is down stops and asks, so there is no
# fallback selection. A route-down marker refuses later launches on that route
# until a Director removes it. The credential and marker paths stay shared
# across projects.
[provider_worker]
priorities = ["0", "1", "2", "3", "4", "urgent", "high", "medium", "low", "none"]

# Owner ruling, 17 October 2026: "deepseek v4.1 flash ... through opencode go as the worker replacing haiku in all projects".
# Owner note, 17 October 2026: "Peak hours are 01:00 - 04:00 and 06:00 - 10:00 UTC for the upstream deepseek provider, when tokens cost double."
[provider_worker.primary]
launcher = "opencode"
provider = "opencode-go"
model = "opencode-go/deepseek-v4.1-flash"
effort = "default"

# The role-to-route choice for analysis, review and merge, beside the provider worker
# selection. Each entry keeps the owner ruling it came from.
[provider_worker.automatic_routes]
analysis = { launcher = "opencode", model = "opencode-go/deepseek-v4.1-flash", effort = "default", reason = "owner ruling of 17 October 2026: deepseek v4.1 flash through opencode go replaces haiku as the worker" }
review = { launcher = "native", model = "gpt-6.1-sol", effort = "low", reason = "owner ruling of 9 October 2026: reviews use Sol low" }
merge = { launcher = "native", model = "gpt-6.1-sol", effort = "low", reason = "owner ruling of 5 October 2026: Merges can go to Sol Low." }

# Owner note, 17 Oct 2026: "Peak hours are 01:00 - 04:00 and 06:00 - 10:00 UTC for the upstream deepseek provider, when tokens cost double."
# A Director turns the pause on or off by changing pause and committing this file.
# Nothing else changes: no card, no code, no restart. The table is read on every
# launch decision, so the next launch after the commit follows the new value.
# A project with no [peak_hours] table never pauses.
[peak_hours]
pause = true
windows_utc = ["01:00-04:00", "06:00-10:00"]
routes = ["opencode-go/deepseek-v4.1-flash"]
